version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: authcat-db

    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: authcat-api

    restart: always

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      DB_HOST: postgres

volumes:
  postgres_data: